<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jablonecké spojení</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="icon" href="/static/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spojení">
<meta name="description" content="Nejbližší odjezdy z jabloneckých zastávek včetně přestupů.">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#f1f5f9; --muted:#94a3b8; --accent:#f97316; --green:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:18px 16px 10px; max-width:640px; margin:0 auto; }
  .nav { display:inline-block; margin-top:10px; color:var(--accent); text-decoration:none;
         font-size:14px; font-weight:600; border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  .nav:hover { border-color:var(--accent); }
  h1 { font-size:20px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; }
  main { max-width:640px; margin:0 auto; padding:0 16px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:14px; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 6px; }
  input { width:100%; padding:12px 14px; font-size:16px; border-radius:10px; border:1px solid var(--line);
          background:#0b1220; color:var(--txt); outline:none; }
  input:focus { border-color:var(--accent); }
  .row { display:flex; gap:10px; align-items:flex-end; }
  .row > div { flex:1; }
  .swap { background:#0b1220; border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:12px; cursor:pointer; font-size:16px; }
  button.go { width:100%; margin-top:14px; padding:14px; font-size:16px; font-weight:600; border:0; border-radius:12px;
              background:var(--accent); color:#fff; cursor:pointer; }
  button.go:active { transform:translateY(1px); }
  .conn { display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  .conn:last-child { border-bottom:0; }
  .badge { min-width:52px; text-align:center; font-weight:700; padding:6px 8px; border-radius:9px; background:var(--accent); color:#fff; font-size:15px; }
  .badge.train { background:#2563eb; } .badge.tram { background:#dc2626; } .badge.bus { background:var(--accent); }
  .dep { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .in { color:var(--green); font-size:13px; font-weight:600; }
  .dest { color:var(--muted); font-size:13px; }
  .arr { margin-left:auto; text-align:right; color:var(--muted); font-size:13px; }
  .arr b { color:var(--txt); font-size:16px; display:block; }
  .note { color:var(--muted); font-size:14px; text-align:center; padding:18px 0; }
  .err { color:#fca5a5; font-size:14px; padding:10px 0; }
  datalist { background:#0b1220; }
  .clock { float:right; color:var(--muted); font-variant-numeric:tabular-nums; font-size:14px; }

  .favbar { margin-top:10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .favbar .lbl { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:#0b1220; border:1px solid var(--line);
          border-radius:999px; padding:7px 10px 7px 12px; font-size:14px; cursor:pointer; color:var(--txt); }
  .chip:hover { border-color:var(--accent); }
  .chip .x { opacity:.6; font-size:12px; padding:0 2px; }
  .chip .x:hover { opacity:1; color:#fca5a5; }
  .save { background:transparent; border:1px dashed var(--line); color:var(--muted); border-radius:999px;
          padding:7px 12px; font-size:13px; cursor:pointer; }
  .save:hover { color:var(--accent); border-color:var(--accent); }

  .transfer { padding:12px 14px; }
  .t-head { font-size:15px; font-weight:600; margin-bottom:8px; }
  .t-head span { color:var(--green); font-weight:600; font-size:13px; }
  .leg { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); padding:4px 0; flex-wrap:wrap; }
  .leg .badge { min-width:44px; font-size:13px; padding:4px 6px; }
  .leg b { color:var(--txt); font-weight:600; }
  .legtime { font-variant-numeric:tabular-nums; color:var(--txt); }
  .t-note { font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<header>
  <span class="clock" id="clock"></span>
  <h1>🚌 Jablonecké spojení</h1>
  <div class="sub">Nejbližší odjezdy mezi dvěma zastávkami · IDOL / GTFS</div>
  <a class="nav" href="/display">Displej odjezdů →</a>
</header>
<main>
  <div class="card">
    <div class="row">
      <div>
        <label for="from">Odkud</label>
        <input id="from" list="stops" placeholder="např. Jablonec nad Nisou, Brandl" autocomplete="off">
      </div>
      <button class="swap" id="swap" title="Prohodit">⇄</button>
      <div>
        <label for="to">Kam</label>
        <input id="to" list="stops" placeholder="např. Liberec, Fügnerova" autocomplete="off">
      </div>
    </div>
    <button class="go" id="go">Najdi nejbližší spoj</button>
    <div class="favbar" id="favbar"></div>
    <div id="msg" class="note"></div>
  </div>
  <div id="results"></div>
</main>
<datalist id="stops"></datalist>
<script>
const fromEl = document.getElementById('from'), toEl = document.getElementById('to');
const list = document.getElementById('stops'), results = document.getElementById('results'),
      msg = document.getElementById('msg'), favbar = document.getElementById('favbar');
let timer = null, currentFav = null;

function tick(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'}); }
setInterval(tick, 1000); tick();

// našeptávač
let acTimer;
function suggest(input){
  clearTimeout(acTimer);
  acTimer = setTimeout(async () => {
    const q = input.value.trim();
    if (q.length < 2) return;
    const r = await fetch('/api/stops?q=' + encodeURIComponent(q));
    const items = await r.json();
    list.innerHTML = items.map(s => `<option value="${s.name.replace(/"/g,'&quot;')}">`).join('');
  }, 180);
}
fromEl.addEventListener('input', () => suggest(fromEl));
toEl.addEventListener('input', () => suggest(toEl));

document.getElementById('swap').onclick = () => {
  [fromEl.value, toEl.value] = [toEl.value, fromEl.value];
  currentFav = null;
  if (fromEl.value && toEl.value) { load(true); schedule(); }
};

async function load(log){
  const a = fromEl.value.trim(), b = toEl.value.trim();
  if (!a || !b) { msg.textContent = 'Zadej obě zastávky.'; return; }
  if (log === true) msg.textContent = 'Hledám…';
  let url = `/api/next?from=${encodeURIComponent(a)}&to=${encodeURIComponent(b)}`;
  if (log === true) url += `&log=1${currentFav ? '&fav=' + currentFav : ''}`;
  try {
    const r = await fetch(url);
    const d = await r.json();
    if (!r.ok) { msg.textContent = d.error || 'Chyba'; results.innerHTML=''; return; }
    const alt = d.transfers || [];
    msg.textContent = (d.connections.length || alt.length)
      ? `Odjezdy v ${d.now} · ${a} → ${b}` : (d.note || 'Nic nejede.');
    results.innerHTML = d.connections.map(c => `
      <div class="card conn">
        <div class="badge ${c.type}">${c.line}</div>
        <div>
          <div class="dep">${c.dep} <span class="in">za ${c.in_min} min</span></div>
          <div class="dest">směr ${c.headsign || c.to_name}</div>
        </div>
        <div class="arr"><b>${c.arr}</b>${c.duration} min</div>
      </div>`).join('');

    if (alt.length) {
      results.innerHTML += `<div class="note" style="padding:14px 0 0;text-align:left">S jedním přestupem</div>`;
      results.innerHTML += alt.map(t => `
        <div class="card transfer">
          <div class="t-head">${t.dep} → ${t.arr} · ${t.duration} min <span>· přestup</span></div>
          ${t.legs.map(l => `
            <div class="leg">
              <span class="badge ${l.type}">${l.line}</span>
              <span class="legtime">${l.dep}</span> ${l.from}
              <span>→</span>
              <b>${l.to}</b>
              <span class="legtime">${l.arr}</span>
            </div>`).join('')}
          <div class="t-note">čekání na přestupu ${t.wait} min</div>
        </div>`).join('');
    }
  } catch(e) { msg.textContent = 'Server neodpovídá.'; }
}

document.getElementById('go').onclick = () => { currentFav = null; load(true); schedule(); };
fromEl.addEventListener('change', () => { if (toEl.value) { currentFav = null; load(true); schedule(); } });
toEl.addEventListener('change', () => { if (fromEl.value) { currentFav = null; load(true); schedule(); } });

function schedule(){
  clearInterval(timer);
  timer = setInterval(() => load(false), 30000);   // obnova každých 30 s, bez zapisování
}

// ---- oblíbené ----
async function renderFavorites(){
  const r = await fetch('/api/favorites');
  const favs = await r.json();
  favbar.innerHTML = '';
  const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = 'Oblíbené:';
  if (favs.length) favbar.appendChild(lbl);
  favs.forEach(f => {
    const chip = document.createElement('span'); chip.className = 'chip';
    chip.title = `${f.stop_from} → ${f.stop_to}`;
    chip.innerHTML = `★ ${f.name} <span class="x" title="Odebrat">✕</span>`;
    chip.onclick = (e) => {
      if (e.target.classList.contains('x')) { removeFav(f.id); return; }
      fromEl.value = f.stop_from; toEl.value = f.stop_to;
      currentFav = f.id; load(true); schedule();
    };
    favbar.appendChild(chip);
  });
  const save = document.createElement('button');
  save.className = 'save'; save.textContent = '+ Uložit tuto trasu';
  save.onclick = saveFavorite;
  favbar.appendChild(save);
}

async function saveFavorite(){
  const a = fromEl.value.trim(), b = toEl.value.trim();
  if (!a || !b) { msg.textContent = 'Nejdřív zadej obě zastávky.'; return; }
  const def = (b.toLowerCase().includes('liberec') || b.toLowerCase().includes('kancel'))
      ? 'Do kanceláře' : `${a.split(',')[1] || a} → ${b.split(',')[1] || b}`;
  const name = prompt('Název oblíbené trasy:', def.trim());
  if (!name) return;
  await fetch('/api/favorites', {method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({name, from:a, to:b})});
  renderFavorites();
}

async function removeFav(id){
  if (!confirm('Odebrat oblíbenou trasu?')) return;
  await fetch('/api/favorites/' + id, {method:'DELETE'});
  renderFavorites();
}

renderFavorites();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
